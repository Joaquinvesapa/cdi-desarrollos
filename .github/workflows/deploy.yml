name: Deploy to DonWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy via FTP
        run: |
          sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" "ftps://a0090955.ferozo.com" -e "
            set ssl:verify-certificate false;
            set ftp:ssl-protect-data true;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --delete --verbose --parallel=2 ./dist/ /public_html/;
            quit
          "
